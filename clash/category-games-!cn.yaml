  # 🎮国际版LOL英雄联盟手游（Riot 全家）
  # 不写 PROCESS-NAME / 包名：按进程会把整个 App 都送去国际游戏，手游起步的「文件验证」要直连才过，
  # 被一起送去海外就卡在「网络不稳定，文件验证可能失败」。只按域名分，验证走后面的直连，下载 / 登录照样走这组。
  # 被上级后缀盖住的单条域名、等同后缀的正则、关键词也都删了（mrs 本来就只认域名 / 后缀，实测能进）。
  # Riot 核心 / 账号 / 客户端配置 / 反作弊 / 支持
  - DOMAIN-SUFFIX,riotgames.com
  - DOMAIN-SUFFIX,riot.com
  - DOMAIN-SUFFIX,rgpub.io
  - DOMAIN-SUFFIX,rdatasrv.net
  # 游戏服务 / 后端（含 Wild Rift 的 wr.pvp.net）
  - DOMAIN-SUFFIX,pvp.net
  - DOMAIN-SUFFIX,leagueoflegends.com
  - DOMAIN-SUFFIX,playvalorant.com
  - DOMAIN-SUFFIX,valorant.com
  - DOMAIN-SUFFIX,teamfighttactics.com
  - DOMAIN-SUFFIX,playruneterra.com
  - DOMAIN-SUFFIX,legendsofruneterra.com
  # 下载 / 更新 / 补丁 / 静态资源
  - DOMAIN-SUFFIX,riotcdn.net
  - DOMAIN-SUFFIX,riotcdn.com
  - DOMAIN-SUFFIX,riotgamesmedia.com
  - DOMAIN-SUFFIX,lolstatic.com
  - DOMAIN-SUFFIX,lolstatic-a.akamaihd.net
  - DOMAIN-SUFFIX,riotgamespatcher-a.akamaized.net
  # 客服
  - DOMAIN-SUFFIX,riotgames.zendesk.com
  # 语音
  - DOMAIN-SUFFIX,vivox.com
  # hCaptcha 登录验证
  - DOMAIN-SUFFIX,hcaptcha.com
  # Riot 官方 / 常见海外 IP
  - IP-CIDR,104.160.128.0/17,no-resolve
  - IP-CIDR,162.249.72.0/21,no-resolve
  - IP-CIDR,192.64.168.0/21,no-resolve
  - IP-CIDR,43.229.64.0/22,no-resolve
  - IP-CIDR,103.219.128.0/22,no-resolve
  - IP-CIDR,103.240.224.0/22,no-resolve
  - IP-CIDR,151.106.246.0/23,no-resolve
  - IP-CIDR,151.106.248.0/22,no-resolve
  - IP-CIDR,151.106.252.0/22,no-resolve
  # ASN 兜底
  - IP-ASN,6507,no-resolve
  - IP-ASN,38118,no-resolve
