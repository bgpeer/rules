  - DOMAIN-SUFFIX,wx2.qq.com
  - DOMAIN-SUFFIX,wx8.qq.com
  - DOMAIN-SUFFIX,wx.qq.com
  - DOMAIN-SUFFIX,wx-cdn.qq.com
