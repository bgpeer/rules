name: Sync Loyalsoldier DAT -> Multi-format Rulesets

on:
  workflow_dispatch: {}
  schedule:
    # 主班次：北京 02:10（UTC 18:10），CF 未触发时兜底
    - cron: "10 18 * * *"
    # 补救班次：北京 05:10 / 08:10（UTC 21:10 / 次日 00:10）。
    # GitHub 高负载时分不到 runner、甚至会直接丢弃计划任务，CF 主触发与
    # 主班次会一起失效（2026-08-06 就这样漏了一整天）。多排两班让它能自愈。
    # 当天已成功同步过的话，decide 几秒内就判定跳过，几乎零成本。
    - cron: "10 21 * * *"
    - cron: "10 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-loyalsoldier-geomrs.yml"
      - "scripts/sync_loy_geo_mrs.sh"
      - "scripts/helpers.py"
      - "scripts/build_adguard_ads.sh"
      - "trigger"

permissions:
  contents: write
  actions: read        # decide 作业需要读取本工作流的运行历史

concurrency:
  group: repo-geo-writer
  cancel-in-progress: false

jobs:
  # ── 决策作业：计划触发时，若近期已成功同步过则跳过（让 schedule 仅作兜底）──
  decide:
    runs-on: ubuntu-latest
    # 只是一次 API 查询，正常 3 秒内完成
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Decide whether to run
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          # 检测锚点：UTC 17:50 =「北京时间 01:50」，即 CF 在北京 02:00
          # （UTC 18:00）触发前 10 分钟。取【最近一次已经过去的】17:50，
          # 也就是当前这一轮同步周期的起点。
          # 用锚点而非滚动窗口的好处：
          #   1) 精准判断「本轮周期 CF 到底跑没跑」；
          #   2) 不会被前一晚的手动运行误判为「已同步」；
          #   3) 即使 GitHub 把计划任务拖延数小时才执行，锚点不动，仍能正确识别。
          ANCHOR_UTC: "17:50:00"
        run: |
          set -euo pipefail

          # 手动 / push 触发 → 一律执行
          if [ "$EVENT" != "schedule" ]; then
            echo "event=$EVENT -> run"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 计划触发 → 查【最近一次经过的 UTC 17:50】之后是否已有成功运行。
          # 必须用「最近经过的」而不是「今天的」：北京 08:10 那班补救落在
          # UTC 次日 00:10，此时 date -u 已翻页，取今天的锚点会指向 17 小时后
          # 的未来，永远查不到成功运行 → 每天都白跑一次全量同步。
          if [[ "$(date -u +%H:%M:%S)" > "$ANCHOR_UTC" ]]; then
            since="$(date -u +%Y-%m-%d)T${ANCHOR_UTC}Z"          # 今天的 17:50 已过
          else
            since="$(date -u -d yesterday +%Y-%m-%d)T${ANCHOR_UTC}Z"   # 尚未到，用昨天的
          fi
          echo "schedule trigger; checking successful runs since ${since}"

          n="$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/sync-loyalsoldier-geomrs.yml/runs?status=success&per_page=30" \
            | jq --arg s "$since" '[.workflow_runs[] | select(.created_at > $s)] | length')"

          echo "recent successful runs in window: ${n}"

          if [ "${n:-0}" -gt 0 ]; then
            echo "已有近期成功同步（疑似 Cloudflare 已触发）-> 跳过本次计划运行"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "近期无成功同步 -> 计划任务兜底执行"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 正常 2 分钟内跑完；卡住时快速失败，好让后续补救班次接手。
    # 注意：timeout-minutes 从【拿到 runner 开始】计时，管不到排队等待，
    # 因此它防的是「跑挂住」，排不到机器那种情况靠上面的补救班次自愈。
    timeout-minutes: 30
    steps:
      # 浅克隆：仓库每日全量重写上万个规则文件，全历史克隆 30s+ 且随时间
      # 持续增长；同步只需要 main 最新快照，深度 1 足够
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}

      # ── 固定工具版本（日常同步不直接追 latest）────────────────────────────
      - name: Load pinned tool versions
        id: vers
        run: |
          set -eux
          test -f .github/tool-versions.env
          cat .github/tool-versions.env
          grep -E '^MIHOMO_VERSION=[0-9]' .github/tool-versions.env
          grep -E '^SINGBOX_VERSION=[0-9]' .github/tool-versions.env
          source .github/tool-versions.env
          echo "mihomo=${MIHOMO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "singbox=${SINGBOX_VERSION}" >> "$GITHUB_OUTPUT"
          # v2dat 无版本固定（上游极少更新），按月重建一次缓存
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # ── 工具缓存：命中则跳过 Go 编译与二进制下载（运行时长稳定的关键）────
      - name: Cache tools (v2dat + mihomo + sing-box)
        id: toolcache
        uses: actions/cache@v4
        with:
          path: ~/nopt-tools
          key: tools-${{ runner.os }}-${{ steps.vers.outputs.month }}-mihomo${{ steps.vers.outputs.mihomo }}-singbox${{ steps.vers.outputs.singbox }}

      # ── Go 工具链（v2dat，仅缓存未命中时）────────────────────────────────
      - name: Setup Go
        if: steps.toolcache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install v2dat (cache miss)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          go install github.com/urlesistiana/v2dat@latest
          mkdir -p ~/nopt-tools
          cp "$(go env GOPATH)/bin/v2dat" ~/nopt-tools/v2dat

      # ── mihomo（mrs 编译，仅缓存未命中时下载）─────────────────────────────
      - name: Install mihomo (cache miss)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          MIHOMO_VERSION="${{ steps.vers.outputs.mihomo }}"

          if [ -z "${MIHOMO_VERSION:-}" ]; then
            echo "::error::MIHOMO_VERSION is empty"
            exit 1
          fi

          echo "mihomo pinned version: $MIHOMO_VERSION"
          ARCH="amd64"
          URL_TGZ="https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-${ARCH}-v${MIHOMO_VERSION}.tar.gz"
          URL_GZ="https://github.com/MetaCubeX/mihomo/releases/download/v${MIHOMO_VERSION}/mihomo-linux-${ARCH}-v${MIHOMO_VERSION}.gz"

          mkdir -p ~/nopt-tools
          if curl -fL --retry 3 --retry-delay 2 "$URL_TGZ" -o mihomo.tar.gz 2>/dev/null; then
            tar -xzf mihomo.tar.gz
            BIN="$(find . -maxdepth 3 -type f -name mihomo | head -n 1)"
            [ -f "$BIN" ] && cp -f "$BIN" ~/nopt-tools/mihomo
          else
            curl -fL --retry 3 --retry-delay 2 "$URL_GZ" -o mihomo.gz
            gunzip -c mihomo.gz > ~/nopt-tools/mihomo
          fi

      # ── sing-box（srs 编译，仅缓存未命中时下载）───────────────────────────
      - name: Install sing-box (cache miss)
        if: steps.toolcache.outputs.cache-hit != 'true'
        run: |
          set -eux
          SINGBOX_VERSION="${{ steps.vers.outputs.singbox }}"

          if [ -z "${SINGBOX_VERSION:-}" ]; then
            echo "::error::SINGBOX_VERSION is empty"
            exit 1
          fi

          echo "sing-box pinned version: $SINGBOX_VERSION"
          ARCH="amd64"
          URL="https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-${ARCH}.tar.gz"

          mkdir -p ~/nopt-tools
          curl -fL --retry 3 --retry-delay 2 "$URL" -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          BIN="$(find . -maxdepth 3 -type f -name sing-box | head -n 1)"
          cp -f "$BIN" ~/nopt-tools/sing-box

      # ── 统一注册工具路径并验证（命中/未命中都执行）────────────────────────
      - name: Setup tool paths
        run: |
          set -eux
          test -x ~/nopt-tools/v2dat || chmod +x ~/nopt-tools/v2dat
          test -x ~/nopt-tools/mihomo || chmod +x ~/nopt-tools/mihomo
          test -x ~/nopt-tools/sing-box || chmod +x ~/nopt-tools/sing-box
          echo "$HOME/nopt-tools" >> "$GITHUB_PATH"
          echo "MIHOMO_BIN=$HOME/nopt-tools/mihomo" >> "$GITHUB_ENV"
          echo "SINGBOX_BIN=$HOME/nopt-tools/sing-box" >> "$GITHUB_ENV"
          ~/nopt-tools/v2dat -h || true
          ~/nopt-tools/mihomo -v
          ~/nopt-tools/sing-box version

      # ── 同步分支到最新 ────────────────────────────────────────────────────
      - name: Sync branch (pre-run)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eux
          BRANCH="${DEFAULT_BRANCH:-main}"
          # 浅克隆下 rebase 可能缺 merge-base；此时无本地修改，直接对齐远端
          git fetch --depth=1 origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      # ── 执行脚本（MIHOMO_BIN/SINGBOX_BIN 已由 Setup tool paths 注入）──────
      - name: Run sync script
        run: |
          set -eux
          chmod +x scripts/sync_loy_geo_mrs.sh
          scripts/sync_loy_geo_mrs.sh

      # ── AdGuard/Pi-hole 去广告名单（托管在独立的 adguard 分支）────────────
      # 只由 category-ads-all 生成这一个文件；其余 geosite 是分流名单，
      # AdGuard 没有「走哪个代理组」的概念，转过去反而会把正常站点拦掉。
      #
      # 为什么放独立分支：ads.txt 17 万行 / 4MB，每天变动约 250 行。
      #   - 提交进 main：每天在历史里沉淀一个大 blob，仓库体积持续膨胀
      #   - 发 Release：会占据仓库首页最显眼的位置，让这个「分流规则」仓库
      #     看起来像个去广告项目，与仓库定位不符
      # 独立分支两头都避开：每次推的是一个【全新的无父提交】并强制覆盖，
      # 历史零累积；main 的目录树里看不到它；首页也不出现 Releases 栏目。
      #
      # 本步骤【绝不拖垮流水线】：任何一环出问题都只告警并 exit 0，
      # mrs/srs/QX 等其余格式的当日更新不受影响。
      - name: Build & publish AdGuard ads list
        env:
          GH_TOKEN: ${{ github.token }}
          ADGUARD_BRANCH: adguard
        run: |
          set -uo pipefail
          mkdir -p adguard

          RAW_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ADGUARD_BRANCH}/ads.txt"

          # 取回上一版：build 脚本靠它做「较上一版跌幅」校验。ads.txt 不在
          # main 里，checkout 后本地没有旧版，不取回的话该校验会永久失效。
          if curl -fsSL --retry 3 --retry-delay 2 "$RAW_URL" -o adguard/ads.txt; then
            echo "  已取回上一版 ads.txt（$(grep -cve '^!' -e '^$' adguard/ads.txt || echo 0) 条）供跌幅校验"
          else
            echo "::warning::未取到上一版 ads.txt（首次发布或 raw 暂不可用），本次跳过跌幅校验"
            rm -f adguard/ads.txt
          fi

          chmod +x scripts/build_adguard_ads.sh
          scripts/build_adguard_ads.sh || echo "::warning::build_adguard_ads.sh 非零退出"

          if [ ! -s adguard/ads.txt ]; then
            echo "::warning::ads.txt 未产出，跳过发布（其余格式不受影响）"
            exit 0
          fi

          # 在独立工作区新建一个单提交仓库再强推：无父提交 = 历史零累积；
          # 也不碰主仓库的索引/工作树（后面的 Commit & push 依赖它保持干净）
          pubdir="$(mktemp -d)"
          cp adguard/ads.txt "$pubdir/ads.txt"
          if (
            set -e
            cd "$pubdir"
            git init -q -b "$ADGUARD_BRANCH"
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ads.txt
            git commit -q -m "chore: update AdGuard ads list ($(grep -c '^||' ads.txt) 条)"
            git push -q --force \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:refs/heads/${ADGUARD_BRANCH}"
          ); then
            echo "  ✓ 已发布：${RAW_URL}"
          else
            echo "::warning::推送 ${ADGUARD_BRANCH} 分支失败，本次沿用线上旧版"
          fi
          rm -rf "$pubdir"

          # 迁移清理：删掉早先的 Release + tag（幂等，删净后即空操作）。
          # 确认首页不再出现 Releases 栏目后，这一块可以整段移除。
          if gh release view "$ADGUARD_BRANCH" >/dev/null 2>&1; then
            gh release delete "$ADGUARD_BRANCH" --yes --cleanup-tag \
              && echo "  ✓ 已删除旧 Release（含 tag）" \
              || echo "::warning::删除旧 Release 失败，可在网页端手动删除"
          fi

      # ── 调试输出 ─────────────────────────────────────────────────────────
      - name: Show outputs (debug)
        run: |
          set -eux
          echo "=== geo/geosite/ ===" && ls geo/geosite/ | head -10 || true
          echo "=== geo/geoip/ ===" && ls geo/geoip/ | head -10 || true
          echo "=== QX/geosite/ ===" && ls QX/geosite/ | head -10 || true
          echo "geosite mrs  : $(find geo/geosite -name '*.mrs'  | wc -l)"
          echo "geosite yaml : $(find geo/geosite -name '*.yaml' | wc -l)"
          echo "geosite list : $(find geo/geosite -name '*.list' | wc -l)"
          echo "geosite json : $(find geo/geosite -name '*.json' | wc -l)"
          echo "geosite srs  : $(find geo/geosite -name '*.srs'  | wc -l)"
          echo "geoip   mrs  : $(find geo/geoip   -name '*.mrs'  | wc -l)"
          echo "qx geosite   : $(find QX/geosite  -name '*.list' | wc -l)"
          echo "adguard ads  : $(grep -c '^||' adguard/ads.txt || echo 0) 条"
          git status --porcelain || true

          echo "=== douyin IP debug ==="
          grep -c "IP-CIDR" geo/geosite/douyin.yaml || true
          grep -c "IP-CIDR" geo/geosite/douyin.list || true
          grep -c "IP-ASN"  geo/geosite/douyin.yaml || true

      # ── Commit & Push（浅克隆安全的重试：换底重提，不依赖 merge-base）────
      - name: Commit & push (safe)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eux
          BRANCH="${DEFAULT_BRANCH:-main}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 产物是本次全量生成的，竞态时无需 rebase 合并历史：
          # 把基座换成远端最新（reset --mixed 保留工作区产物），只重新
          # 提交产物目录即可，浅克隆下也不需要 merge-base
          for i in 1 2 3 4 5; do
            git add -A geo/geosite geo/geoip QX

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: sync Loyalsoldier dat -> multi-format rulesets (geo + QX)"

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push success."; exit 0
            fi

            echo "Push rejected (race). retry=${i}"
            git fetch --depth=1 origin "${BRANCH}"
            git reset --mixed "origin/${BRANCH}"

            sleep $((i*2))
          done

          echo "Failed to push after retries."
          exit 1
